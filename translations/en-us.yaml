        amount: "The amount to charge. Leave blank when it must be set for each customer."
        attribute: "The attribute this charge depends on."
        equals: "For a choice attribute, the choice that triggers the charge. Leave blank for other attribute types."
        unit: "The unit used to measure."
        required: "When on, the value must be present."
        variant: "Which kind of item this is. Each kind has its own fields."
